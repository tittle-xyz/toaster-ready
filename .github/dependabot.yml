version: 2
updates:
  # This repo's own rubric scores dependency patching, and it was scoring itself a
  # zero for it. Monthly: a CLI with a handful of Go deps doesn't need weekly churn.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # go-shared-build refs are owned by `make update-build`, which bumps the
      # Makefile pin and these `uses:` refs together. Letting Dependabot move
      # them independently would put the CI workflow on one version and the Make
      # targets on another — the exact drift that command exists to prevent.
      - dependency-name: "tittle-xyz/go-shared-build/*"
