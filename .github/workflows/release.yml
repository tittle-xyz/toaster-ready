name: release

# Conventional Commits -> release-please maintains a release PR; merging it tags
# the version, writes the CHANGELOG, and attaches cross-platform binaries and
# checksums built by GoReleaser (.goreleaser.yaml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: tittle-xyz/go-shared-build/.github/workflows/go-release-cli.yml@v0.4.0
    with:
      # This repo is consumed as a GitHub Action (`uses: tittle-xyz/toaster-ready@v0`),
      # so the major tag has to keep moving to the latest release in the series.
      major-tag: true
