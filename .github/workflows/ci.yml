name: ci

# The gate lives in go-shared-build so it can be improved once for every project.
# See: https://github.com/tittle-xyz/go-shared-build
on:
  pull_request:
    # `edited` matters: the pr-title check reads the PR title, and without it a
    # rename does not re-run the check — leaving a corrected title still showing
    # red. The default types are opened/synchronize/reopened only.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: tittle-xyz/go-shared-build/.github/workflows/go-ci.yml@v0.9.1
    with:
      # The shared readiness job installs a *published* toaster release. This repo
      # is toaster-ready, so that would score it with the previous version rather
      # than the code under review. The `gate` job below dogfoods this tree instead.
      readiness: false

  gate:
    runs-on: ubuntu-latest
    # Deliberately read-only. The badge is committed by the author (pre-commit
    # hook), and CI only verifies it — so nothing here needs write access, and a
    # consumer can protect their default branch with no bypass actor.
    steps:
      - uses: actions/checkout@v7
        with:
          # Several readiness signals are derived from git history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Verify, never write. The badge is generated offline and is therefore
      # reproducible, so a stale committed badge is a real failure rather than a
      # timing artifact.
      #
      # This replaced a job that pushed the badge itself. That does not survive
      # branch protection: pushing to a protected default branch needs a bypass
      # actor, and pushing to a PR branch with the workflow token yields a run
      # stuck in `action_required` with zero check runs — so the PR becomes
      # unmergeable wherever required status checks are on. Verified both.
      - name: Badge is current
        run: make badge-check

      - name: toaster-ready gates itself
        run: make gate
